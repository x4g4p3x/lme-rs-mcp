[package]
name = "lme-rs-mcp"
version = "0.3.0"
edition = "2021"
authors = ["Martin Huck <x4g4p3x@users.noreply.github.com>"]
description = "Model Context Protocol (MCP) server exposing lme-rs mixed-effects modeling tools"
license = "MIT"
repository = "https://github.com/x4g4p3x/lme-rs-mcp"
readme = "README.md"
keywords = ["mcp", "mixed-effects", "lme4", "statistics"]
categories = ["science", "command-line-utilities"]

[[bin]]
name = "lme-rs-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lme-rs-agent = "=0.2.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
lme-rs = "=0.2.7"
polars = { version = "0.46.0", features = ["csv"] }
serde_json = "1"
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }

[profile.test]
inherits = "dev"
opt-level = 2
