name: Fix semantic lint

on:
  push:
    branches:
      - agent/complete-semantic-api

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-semantic-api
      - name: Remove clone-on-copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/api.rs')
          text = p.read_text()
          old = 'let family = cached.fit.family.clone().ok_or_else(|| {'
          new = 'let family = cached.fit.family.ok_or_else(|| {'
          if old not in text:
              raise SystemExit('expected source text not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.rs
          git commit -m "Fix clone-on-copy lint"
          git push origin HEAD:agent/complete-semantic-api
