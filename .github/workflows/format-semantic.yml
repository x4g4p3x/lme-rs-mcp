name: Format semantic API

on:
  push:
    branches:
      - agent/complete-semantic-api

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-semantic-api
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.rs src/mcp.rs tests/integration.rs
          git commit -m "Apply rustfmt to semantic API"
          git push origin HEAD:agent/complete-semantic-api
