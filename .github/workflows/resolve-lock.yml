name: Resolve lme-rs lockfile

on:
  push:
    branches:
      - agent/lme-rs-0.2.1-model-kind

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.head_commit.message != 'Refresh Cargo.lock for lme-rs 0.2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lme-rs 0.2.1
        run: cargo update -p lme-rs --precise 0.2.1
      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "Refresh Cargo.lock for lme-rs 0.2.1"
          git push
