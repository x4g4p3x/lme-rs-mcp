name: Format fit_model changes

on:
  push:
    branches:
      - agent/fit-model-glmm

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply rustfmt to fit_model changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet || git commit -m "Apply rustfmt to fit_model changes"
          git push
